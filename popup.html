<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 280px; font: 13px/1.4 -apple-system, "Segoe UI", Arial, sans-serif;
         padding: 12px; margin: 0; color: #1a1a1a; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  button { width: 100%; padding: 9px; margin-bottom: 8px; border: 1px solid #ccc;
           border-radius: 6px; background: #fff; cursor: pointer; font-size: 13px; }
  button:hover { background: #f5f5f5; }
  button.primary { background: #16a34a; color: #fff; border-color: #16a34a; }
  button.primary:hover { background: #128a3e; }
  #status { font-size: 12px; color: #555; margin-top: 6px; min-height: 16px; }

  #unmatched { display: none; margin-top: 8px; border-top: 1px solid #eee; padding-top: 10px; }
  #unmatched .hint { font-size: 12px; color: #666; margin-bottom: 8px; }
  .row { margin-bottom: 9px; }
  .row .rowhead { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  .row label { font-size: 12px; color: #333; flex: 1; word-break: break-word; }
  .row input[type=text] { width: 100%; padding: 6px 7px; border: 1px solid #ddd;
                           border-radius: 5px; font-size: 12.5px; box-sizing: border-box; }

  footer { margin-top: 10px; border-top: 1px solid #eee; padding-top: 8px;
           font-size: 11.5px; color: #777; display: flex; justify-content: space-between; }
  footer a { color: #777; cursor: pointer; text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <h1>Fill It</h1>

  <button id="fill" class="primary">Fill this page</button>
  <div id="status"></div>

  <div id="unmatched">
    <div class="hint">Didn't recognise these — fill them in and I'll remember what you tick.</div>
    <div id="unmatched-list"></div>
    <button id="save-fill" class="primary">Save &amp; fill</button>
  </div>

  <footer>
    <a id="how">How this works</a>
    <a id="edit">Edit fields</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
