<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Fill It — Edit fields</title>
<style>
  body {
    font-family: -apple-system, Segoe UI, Arial, sans-serif;
    max-width: 720px;
    margin: 32px auto;
    padding: 0 16px;
    color: #1a1a1a;
  }
  h1 { font-size: 20px; }
  p.sub { color: #666; font-size: 13px; margin-top: -8px; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; font-size: 13px; }
  th { color: #888; font-weight: 500; font-size: 12px; }
  input[type=text] {
    width: 100%;
    padding: 5px 7px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 13px;
    box-sizing: border-box;
  }
  .aliases { width: 220px; }
  .del {
    background: none;
    border: none;
    color: #b91c1c;
    cursor: pointer;
    font-size: 16px;
  }
  #add-row {
    margin-top: 14px;
    padding: 8px 14px;
    background: #16a34a;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  #save {
    margin-top: 16px;
    padding: 9px 18px;
    background: #111;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  #saved-msg { color: #16a34a; font-size: 13px; margin-left: 10px; }
</style>
</head>
<body>
  <h1>Fill It — your fields</h1>
  <p class="sub">Edit values, tweak aliases (comma-separated words the matcher looks for), or add your own fields.</p>

  <table>
    <thead>
      <tr>
        <th>Label</th>
        <th>Value</th>
        <th class="aliases">Aliases</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <button id="add-row">+ Add field</button>
  <div>
    <button id="save">Save</button>
    <span id="saved-msg"></span>
  </div>

  <script src="lib/fields.js"></script>
  <script src="options.js"></script>
</body>
</html>
