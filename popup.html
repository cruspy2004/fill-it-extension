<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 272px; font: 13px/1.4 -apple-system, "Segoe UI", Arial, sans-serif;
         padding: 12px; margin: 0; color: #1a1a1a; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  button { width: 100%; padding: 9px; margin-bottom: 8px; border: 1px solid #ccc;
           border-radius: 6px; background: #fff; cursor: pointer; font-size: 13px; }
  button:hover { background: #f5f5f5; }
  button.primary { background: #16a34a; color: #fff; border-color: #16a34a; }
  button.primary:hover { background: #128a3e; }
  #status { font-size: 12px; color: #555; margin-top: 6px; min-height: 16px; }
  #pending-banner { display: none; background: #f0fdf4; border: 1px solid #bbf7d0;
                    border-radius: 6px; padding: 8px 10px; margin-bottom: 10px; font-size: 12px; }
  #review { display: none; margin-top: 8px; border-top: 1px solid #eee; padding-top: 8px; }
  #review-list { max-height: 220px; overflow-y: auto; font-size: 12px; }
  .row { display: flex; align-items: flex-start; gap: 6px; padding: 4px 0;
         border-bottom: 1px solid #f0f0f0; }
  .row label { flex: 1; word-break: break-word; }
  .row .val { color: #555; }
  .tag { font-size: 10px; padding: 1px 5px; border-radius: 3px; margin-left: 4px; }
  .tag.new { background: #dcfce7; color: #166534; }
  .tag.changed { background: #fef3c7; color: #92400e; }
  .tag.unmatched { background: #f1f5f9; color: #475569; }
  footer { margin-top: 10px; border-top: 1px solid #eee; padding-top: 8px;
           font-size: 11.5px; color: #777; display: flex; justify-content: space-between; }
  footer a { color: #777; cursor: pointer; text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <h1>Fill It</h1>

  <div id="pending-banner"></div>

  <button id="fill" class="primary">Fill this page</button>
  <button id="save">Save this form</button>
  <button id="enable-here" style="display:none">Enable auto-detect here</button>
  <div id="status"></div>

  <div id="review">
    <div id="review-list"></div>
    <button id="confirm-save" class="primary">Save selected</button>
  </div>

  <footer>
    <a id="how">How this works</a>
    <a id="edit">Edit fields</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
